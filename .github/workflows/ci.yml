name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up virtual environment
        run: |
          ./createvenv.sh

      - name: Run lint and format checks
        run: |
          source .venv/bin/activate
          ./check.sh
